  <script>
  loadHeaderMenu();
  // document.addEventListener("DOMContentLoaded", footer);
  async function loadLogoContent() {
  try {
    const res = await fetch(`${BACKEND_BASE_URL}/editIndexPages/home`);
    if (!res.ok) throw new Error("Network error");
    const data = await res.json();

    const logoImg = document.getElementById("logoImage");
    if (data.logoUrl) {
      logoImg.src = data.logoUrl;

      if (data.logoShape === "circle") {
        logoImg.classList.add("circle");
      } else {
        logoImg.classList.remove("circle");
      }
    }

    if (data.homeWebsitename) {
      document.getElementById("websiteName").textContent = data.homeWebsitename;
    }
  } catch (err) {
    console.error("Error loading home data:", err);
  }
  }

  window.addEventListener("DOMContentLoaded", loadLogoContent)
  async function loadContactInfo() {
    try {
      const res = await fetch(`${BACKEND_BASE_URL}/editIndexPages/contact`);
      const data = await res.json();

      if (res.ok) {
        document.getElementById("contactHeader").textContent = data.contactHeader || "Contact Us";
        document.getElementById("contactAddress").textContent = `Address: ${data.contactAddress}`;
        document.getElementById("contactMobile").textContent = `Mobile: ${data.contactMobile}`;
        // document.getElementById("contactEmail").innerHTML = `Email: <a href="mailto:${data.contactEmail}">${data.contactEmail}</a>`;
        document.getElementById("contactEmail").innerHTML =`Email: <a href="mailto:${data.contactTriggeredEmail}">${data.contactEmail}</a>`;
        // ✅ Save hidden email (for internal use, bots, logging, etc.)
      // document.getElementById("hiddenTriggerdEmail").textContent = `TriggerdEmail: ${data.contactTriggeredEmail}`;
      document.getElementById("contactMessage").textContent = `Join Us: ${data.contactMessage}`;
      } else {
        console.error("Failed to fetch contact info", data.error);
      }
    } catch (err) {
      console.error("Error loading contact info:", err);
    }
  }

  loadContactInfo();

  document.getElementById('contactForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const name = document.getElementById('name').value;
    const mobile = document.getElementById('mobile').value;
    const message = document.getElementById('message').value;

    const responseMessage = document.getElementById('responseMessage');
    const BACKEND_BASE_URL = window.BACKEND_BASE_URL || 'http://localhost:5000';

    try {
      const response = await fetch(`${BACKEND_BASE_URL}/api/contact`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ name, mobile, message })
      });

      const result = await response.json();

      if (response.ok) {
        responseMessage.style.color = 'green';
        responseMessage.textContent = "Email sent successfully! We'll get back to you in 24 hours.";
        document.getElementById('contactForm').reset();
      } else {
        responseMessage.style.color = 'red';
        responseMessage.textContent = "Error: " + result.error;
      }
    } catch (error) {
      responseMessage.style.color = 'red';
      responseMessage.textContent = "Failed to send message. Please try again later.";
    }
  });
</script>
