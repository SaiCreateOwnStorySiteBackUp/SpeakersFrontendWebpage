  <script>
  loadHeaderMenu();
  async function loadLogoContent() {
  try {
    const res = await fetch(`${BACKEND_BASE_URL}/editIndexPages/home`);
    if (!res.ok) throw new Error("Network error");
    const data = await res.json();

    const logoImg = document.getElementById("logoImage");
    if (data.logoUrl) {
      logoImg.src = data.logoUrl;

      if (data.logoShape === "circle") {
        logoImg.classList.add("circle");
      } else {
        logoImg.classList.remove("circle");
      }
    }

    if (data.homeWebsitename) {
      document.getElementById("websiteName").textContent = data.homeWebsitename;
    }
  } catch (err) {
    console.error("Error loading home data:", err);
  }
}

window.addEventListener("DOMContentLoaded", loadLogoContent)

  async function loadAboutData() {
    try {
      const res = await fetch(`${BACKEND_BASE_URL}/editIndexPages/about`);
      const data = await res.json();
      // Update image src
      const logoImg = document.getElementById("adminLogo");
      if (!res.ok) throw new Error("Failed to fetch about data");

      if (data.logoUrl) {
        logoImg.src = data.logoUrl;
      } else {
        logoImg.src = "images/admin.png"; // fallback image
      }

      // Update logo shape
      if (data.logoShape === "circle") {
        logoImg.classList.add("circle-logo");
        logoImg.classList.remove("default-logo");
      } else {
        logoImg.classList.add("default-logo");
        logoImg.classList.remove("circle-logo");
      }

      // Update about text
      document.getElementById("aboutParagraph").textContent = data.aboutText || "Welcome to Free Voices!";
    } catch (err) {
      console.error("Error loading about data:", err);
    }
  }

  loadAboutData();
</script>
