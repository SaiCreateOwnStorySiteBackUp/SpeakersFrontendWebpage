    <script src="/javaScript/loadHeader.js"></script>
    <script src="/javaScript/footer.js"></script>
    <script>
    loadHeaderMenu();
    async function loadLogoContent() {
    try {
      const res = await fetch(`${BACKEND_BASE_URL}/editIndexPages/home`);
      if (!res.ok) throw new Error("Network error");
      const data = await res.json();

      const logoImg = document.getElementById("logoImage");
      if (data.logoUrl) {
        logoImg.src = data.logoUrl;

        if (data.logoShape === "circle") {
          logoImg.classList.add("circle");
        } else {
          logoImg.classList.remove("circle");
        }
      }

      if (data.homeWebsitename) {
        document.getElementById("websiteName").textContent = data.homeWebsitename;
      }
    } catch (err) {
      console.error("Error loading home data:", err);
    }
  }

  window.addEventListener("DOMContentLoaded", loadLogoContent)
    // const res = await fetch(`${BACKEND_BASE_URL}/editIndexPages/contact`);
  async function loadTerms() {
    try {
      const res = await fetch(`${BACKEND_BASE_URL}/editIndexPages/terms`);
      const data = await res.json();

      document.getElementById("termsHeader").textContent = data.termsAndConditionsHeader || "Terms and Conditions";
      document.getElementById("termsText").textContent = data.termsAndConditionsText || "No terms provided.";
    } catch (err) {
      console.error("Error loading terms:", err);
    }
  }

  loadTerms();
</script>

  </body>
