  async function loadHomePageContent() {
      try {
        const res = await fetch(`${window.BACKEND_BASE_URL}/editIndexPages/home`);
        if (!res.ok) throw new Error("Network error");

        const data = await res.json();

        // Update logo
        // if (data.logoUrl) {
        //   document.querySelector(".logo").src = data.logoUrl;
        // }
        if (data.logoUrl) {
          const logoImg = document.querySelector(".logo");
          logoImg.src = data.logoUrl;

          // Apply circle class if needed
          if (data.logoShape === "circle") {
            logoImg.classList.add("circle");
          } else {
            logoImg.classList.remove("circle");
          }
        }

        // Update header
        if (data.homeHeader) {
          document.querySelector("#home h1").innerText = data.homeHeader;
        }

        // Update paragraph
        if (data.homeParagraph) {
          document.querySelector("#home p").innerHTML = data.homeParagraph;
        }

      } catch (err) {
        console.error("Failed to load homepage content", err);
      }
    }

    window.addEventListener("DOMContentLoaded", loadHomePageContent);

  async function loadSpeakersToHomePage() {
  const container = document.getElementById("speakersContainer");
  container.innerHTML = ""; // Clear loading state

  try {
    const res = await fetch(`${window.BACKEND_BASE_URL}/users/allSpeakers`);
    const speakers = await res.json();

    if (!Array.isArray(speakers)) {
      container.innerHTML = "<p>No speaker data found.</p>";
      return;
    }

    for (const speaker of speakers) {
      const imgSrc = speaker.profileImage
        ? `${speaker.profileImage}?t=${Date.now()}`  // Force fresh image
        : "/images/default.jpg";

      const card = document.createElement("div");
      card.className = "speaker";

      card.innerHTML = `
        <a href="/${speaker.name.toLowerCase()}.html" onclick="trackClick('${speaker.name.toLowerCase()}')" style="text-decoration: none; color: inherit;">
          <img src="${imgSrc}" alt="${speaker.name}">
          <h3>${speaker.name}</h3>
        </a>
        <p>${speaker.topic || "Speaker"}</p>
      `;

      container.appendChild(card);
    }
  } catch (err) {
    console.error("Failed to load speakers:", err);
    container.innerHTML = "<p>Unable to load speakers.</p>";
  }
}

// Run on page load
loadSpeakersToHomePage();

async function loadVisitorCount () {

  /* ── 1. get user position (permission‑based) ─────────────────── */
  let coords = null;
  try {
    coords = await new Promise((res, rej) =>
      navigator.geolocation.getCurrentPosition(
        p => res({
          lat: +p.coords.latitude .toFixed(8),   // 8 dp
          lon: +p.coords.longitude.toFixed(8)
        }),
        err => res(null),                        // ignore denial
        { enableHighAccuracy:true, timeout:5000 }
      ));
  } catch { /* ignore */ }

  /* ── 2. track visit ───────────────────────────────────────────── */
  try {
    await fetch(`${window.BACKEND_BASE_URL}/api/visitor/track`, {
      method : 'POST',
      headers: { 'Content-Type':'application/json' },
      body   : JSON.stringify({ ...coords })     // {lat,lon} or {}
    });
  } catch (e) {
    console.warn('Track failed:', e);
  }

  /* ── 3. update counter (unchanged) ────────────────────────────── */
  try {
    const r   = await fetch(`${window.BACKEND_BASE_URL}/api/visitor/count`);
    const { count = 0 } = await r.json();
    document.getElementById('visitor-count').textContent = count;
  } catch (e){
    console.warn('Cnt fetch failed:',e);
    document.getElementById('visitor-count').textContent = '0';
  }
}

/* first paint */
loadVisitorCount();

/* speaker clicks – unchanged */
function trackClick(speaker){
  fetch(`${window.BACKEND_BASE_URL}/api/visitor/track-click`,{
    method : 'POST',
    headers: { 'Content-Type':'application/json' },
    body   : JSON.stringify({ speaker })
  }).catch(e=>console.error('Click track failed:',e));
}
